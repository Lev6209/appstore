{% extends 'main/base.html' %}

{% block title %}Сброс пароля — AppStore{% endblock %}

{% block content %}
    <h2>Сброс пароля</h2>

    <p>Укажите почту, используемую при регистрации</p>

    <form method="post" action="{% url 'main:password_reset' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить ссылку на изменение пароля</button>
    </form>

{% endblock %}
